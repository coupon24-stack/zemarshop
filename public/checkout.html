<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validation de commande — ZemarShop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages/home.css" />
  <link rel="stylesheet" href="./css/pages/cart.css" />
</head>
<body style="background-color: var(--color-bg-alt);">

  <header class="navbar" id="navbar"></header>

  <main class="cart-page container section">
    <h1 class="cart-page__title">Validation de commande</h1>

    <div class="cart-content">
      
      <!-- Formulaire de livraison -->
      <div style="background: white; padding: 24px; border-radius: 16px; box-shadow: var(--shadow-sm);">
        <h2 style="margin-bottom: 16px; font-size: 18px;">Informations de livraison</h2>
        
        <form id="checkoutForm">
          <div class="field">
            <label class="field__label">Nom complet</label>
            <input type="text" class="field__input" id="deliveryName" placeholder="Ex: Koffi Yao" required />
          </div>
          
          <div class="field" style="margin-top: 12px;">
            <label class="field__label">Numéro de téléphone</label>
            <input type="tel" class="field__input" id="deliveryPhone" placeholder="Ex: 0700000000" required />
          </div>

          <div class="field" style="margin-top: 12px;">
            <label class="field__label">Ville</label>
            <input type="text" class="field__input" id="deliveryCity" placeholder="Ex: Abidjan" required />
          </div>

          <div class="field" style="margin-top: 12px;">
            <label class="field__label">Commune</label>
            <input type="text" class="field__input" id="deliveryCommune" placeholder="Ex: Cocody" required />
          </div>

          <div class="field" style="margin-top: 12px;">
            <label class="field__label">Adresse de livraison</label>
            <input type="text" class="field__input" id="deliveryAddress" placeholder="Ex: Rue des Jardins" required />
          </div>

          <h2 style="margin-top: 24px; margin-bottom: 16px; font-size: 18px;">Mode de paiement</h2>

          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label style="display: flex; align-items: center; gap: 8px; padding: 12px; border: 1px solid var(--color-primary); border-radius: 8px; background: var(--color-primary-light); cursor: pointer;">
              <input type="radio" name="payment" value="cash_on_delivery" checked />
              <span>💵 Paiement à la livraison</span>
            </label>
          </div>
        </form>
      </div>

      <!-- Récapitulatif -->
      <div>
        <div class="cart-summary" style="position: static;">
          <h2 class="cart-summary__title">Récapitulatif</h2>
          
          <div id="checkoutItems" style="margin-bottom: 16px; font-size: 14px; color: var(--color-text-soft);"></div>

          <div class="cart-summary__row" style="border-top: 1px solid var(--color-border); padding-top: 12px;">
            <span>Sous-total</span>
            <span id="checkoutSubtotal">0 FCFA</span>
          </div>
          <div class="cart-summary__row">
            <span>Frais de livraison</span>
            <span id="checkoutDelivery">1 500 FCFA</span>
          </div>
          <div class="cart-summary__row cart-summary__row--total">
            <span>Total</span>
            <span id="checkoutTotal">0 FCFA</span>
          </div>

          <button type="submit" form="checkoutForm" class="btn btn--primary btn--lg btn--full" style="margin-top: 16px;" id="btnConfirmOrder">
            Confirmer la commande
          </button>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script type="module">
    import { renderNavbar } from './js/ui/navbar.js';
    import { renderFooter } from './js/ui/footer.js';
    import { initSupabase } from './js/supabase-client.js';
    import { formatPrice } from './js/utils/format.js';

    renderNavbar('checkout');
    renderFooter();

    const sb = await initSupabase();
    const DELIVERY_FEE = 1500;
    let cart = [];

    // 1. Vérifier la connexion
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      alert("Veuillez vous connecter pour passer commande.");
      window.location.href = './login.html';
    }

    // 2. Charger le panier
    try {
      const saved = localStorage.getItem('zemar_cart');
      if (saved) cart = JSON.parse(saved);
    } catch(e) {}

    if (cart.length === 0) {
      window.location.href = './cart.html';
    }

    // 3. Afficher le récapitulatif
    const itemsEl = document.getElementById('checkoutItems');
    let subtotal = 0;

    itemsEl.innerHTML = cart.map(item => {
      subtotal += item.price * item.quantity;
      return `
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
          <span>${item.quantity} x ${item.name}</span>
          <span>${formatPrice(item.price * item.quantity)}</span>
        </div>
      `;
    }).join('');

    const total = subtotal + DELIVERY_FEE;
    document.getElementById('checkoutSubtotal').textContent = formatPrice(subtotal);
    document.getElementById('checkoutDelivery').textContent = formatPrice(DELIVERY_FEE);
    document.getElementById('checkoutTotal').textContent = formatPrice(total);

    // 4. Enregistrer la commande dans Supabase
    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btnConfirmOrder');
      btn.textContent = 'Traitement en cours...';
      btn.disabled = true;

      try {
        // On génère un numéro de commande unique
        const orderNumber = 'ZM-' + Date.now().toString().slice(-6);

        // A. Insérer la commande principale
        const { data: order, error: orderError } = await sb.from('orders').insert([{
          order_number: orderNumber,
          client_id: session.user.id,
          delivery_full_name: document.getElementById('deliveryName').value,
          delivery_phone: document.getElementById('deliveryPhone').value,
          delivery_city: document.getElementById('deliveryCity').value,
          delivery_commune: document.getElementById('deliveryCommune').value,
          delivery_address: document.getElementById('deliveryAddress').value,
          total_fcfa: total,
          status: 'new'
        }]).select().single();

        if (orderError) throw orderError;

        // B. Récupérer les shop_id des produits achetés
        const productIds = cart.map(item => item.id);
        const { data: productsData } = await sb.from('products').select('id, shop_id').in('id', productIds);
        
        const productShopMap = {};
        if (productsData) {
          productsData.forEach(p => productShopMap[p.id] = p.shop_id);
        }

        // C. Insérer les lignes de commande
        const orderItemsData = cart.map(item => ({
          order_id: order.id,
          product_id: item.id,
          product_name: item.name,
          unit_price_fcfa: item.price,
          quantity: item.quantity,
          commission_fcfa: item.price * 0.10, // Commission de 10%
          shop_id: productShopMap[item.id] || null // Lien avec la boutique
        }));

        const { error: itemsError } = await sb.from('order_items').insert(orderItemsData);
        if (itemsError) throw itemsError;

        // D. Vider le panier
        localStorage.removeItem('zemar_cart');
        localStorage.removeItem('zemar_cart_count');

        // E. Rediriger vers la page de succès
        window.location.href = `./order-success.html?num=${orderNumber}`;

      } catch (error) {
        console.error(error);
        alert("Erreur lors de la commande : " + error.message);
        btn.textContent = 'Confirmer la commande';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
