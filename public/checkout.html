<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validation de commande — ZemarShop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages/home.css" />
  <link rel="stylesheet" href="./css/pages/cart.css" />
</head>
<body style="background-color: var(--color-bg-alt);">

  <header class="navbar" id="navbar"></header>

  <main class="cart-page container section">
    <h1 class="cart-page__title">Validation de commande</h1>

    <div class="cart-content">
      
      <div style="background: white; padding: 24px; border-radius: 16px; box-shadow: var(--shadow-sm);">
        <h2 style="margin-bottom: 16px; font-size: 18px;">Informations de livraison</h2>
        
        <div id="autofillMsg" style="display: none; background: var(--color-success-soft); color: var(--color-success); padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; font-weight: 600;">
          ✅ Informations pré-remplies avec votre adresse par défaut.
        </div>

        <form id="checkoutForm">
          <div class="field">
            <label class="field__label">Nom complet</label>
            <input type="text" class="field__input" id="deliveryName" placeholder="Ex: Koffi Yao" required />
          </div>
          
          <div class="field" style="margin-top: 12px;">
            <label class="field__label">Numéro de téléphone</label>
            <input type="tel" class="field__input" id="deliveryPhone" placeholder="Ex: 0700000000" required />
          </div>

          <div class="field" style="margin-top: 12px;">
            <label class="field__label">Ville</label>
            <input type="text" class="field__input" id="deliveryCity" placeholder="Ex: Abidjan" required />
          </div>

          <div class="field" style="margin-top: 12px;">
            <label class="field__label">Commune</label>
            <input type="text" class="field__input" id="deliveryCommune" placeholder="Ex: Cocody" required />
          </div>

          <div class="field" style="margin-top: 12px;">
            <label class="field__label">Adresse de livraison</label>
            <input type="text" class="field__input" id="deliveryAddress" placeholder="Ex: Rue des Jardins" required />
          </div>

          <h2 style="margin-top: 24px; margin-bottom: 16px; font-size: 18px;">Mode de paiement</h2>

          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label style="display: flex; align-items: center; gap: 8px; padding: 12px; border: 1px solid var(--color-border); border-radius: 8px; cursor: pointer;">
              <input type="radio" name="payment" value="cash_on_delivery" checked onchange="toggleTransactionCode()" />
              <span>💵 Paiement à la livraison</span>
            </label>
            <label style="display: flex; align-items: center; gap: 8px; padding: 12px; border: 1px solid var(--color-border); border-radius: 8px; cursor: pointer;">
              <input type="radio" name="payment" value="orange_money" onchange="toggleTransactionCode()" />
              <span>🟠 Orange Money</span>
            </label>
          </div>

          <div id="mobileMoneyInstructions" style="display: none; background: var(--color-primary-light); padding: 16px; border-radius: 8px; margin-top: 16px;">
            <p style="font-size: 14px; font-weight: 600; color: var(--color-primary); margin-bottom: 8px;">Instructions de paiement :</p>
            <p style="font-size: 13px; margin-bottom: 12px;">
              Veuillez envoyer <strong id="amountToPay">0 FCFA</strong> au numéro <strong>07 00 00 00 00 00</strong> (ZemarShop).
            </p>
            <div class="field">
              <label class="field__label">Code de transaction</label>
              <input type="text" class="field__input" id="transactionCode" placeholder="Ex: MP123456789" />
            </div>
          </div>
        </form>
      </div>

      <div>
        <div class="cart-summary" style="position: static;">
          <h2 class="cart-summary__title">Récapitulatif</h2>
          <div id="checkoutItems" style="margin-bottom: 16px; font-size: 14px; color: var(--color-text-soft);"></div>
          <div class="cart-summary__row" style="border-top: 1px solid var(--color-border); padding-top: 12px;">
            <span>Sous-total</span>
            <span id="checkoutSubtotal">0 FCFA</span>
          </div>
          <div class="cart-summary__row">
            <span>Frais de livraison</span>
            <span id="checkoutDelivery">1 500 FCFA</span>
          </div>
          <div class="cart-summary__row cart-summary__row--total">
            <span>Total</span>
            <span id="checkoutTotal">0 FCFA</span>
          </div>
          <button type="submit" form="checkoutForm" class="btn btn--primary btn--lg btn--full" style="margin-top: 16px;" id="btnConfirmOrder">
            Confirmer la commande
          </button>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script type="module">
    import { renderNavbar } from './js/ui/navbar.js';
    import { renderFooter } from './js/ui/footer.js';
    import { initSupabase } from './js/supabase-client.js';
    import { formatPrice } from './js/utils/format.js';

    renderNavbar('checkout');
    renderFooter();

    const sb = await initSupabase();
    const DELIVERY_FEE = 1500;
    let cart = [];
    let totalToPay = 0;

    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      alert("Veuillez vous connecter pour passer commande.");
      window.location.href = './login.html';
    }

    async function autofillAddress() {
      const { data: defaultAddr } = await sb.from('addresses').select('*').eq('client_id', session.user.id).eq('is_default', true).maybeSingle();
      if (defaultAddr) {
        document.getElementById('deliveryName').value = defaultAddr.full_name;
        document.getElementById('deliveryPhone').value = defaultAddr.phone;
        document.getElementById('deliveryCity').value = defaultAddr.city;
        document.getElementById('deliveryCommune').value = defaultAddr.commune;
        document.getElementById('deliveryAddress').value = defaultAddr.address;
        document.getElementById('autofillMsg').style.display = 'block';
      }
    }
    autofillAddress();

    try {
      const saved = localStorage.getItem('zemar_cart');
      if (saved) cart = JSON.parse(saved);
    } catch(e) {}

    if (cart.length === 0) {
      window.location.href = './cart.html';
    }

    const itemsEl = document.getElementById('checkoutItems');
    let subtotal = 0;

    itemsEl.innerHTML = cart.map(item => {
      subtotal += item.price * item.quantity;
      return `<div style="display: flex; justify-content: space-between; margin-bottom: 8px;"><span>${item.quantity} x ${item.name}</span><span>${formatPrice(item.price * item.quantity)}</span></div>`;
    }).join('');

    totalToPay = subtotal + DELIVERY_FEE;
    document.getElementById('checkoutSubtotal').textContent = formatPrice(subtotal);
    document.getElementById('checkoutDelivery').textContent = formatPrice(DELIVERY_FEE);
    document.getElementById('checkoutTotal').textContent = formatPrice(totalToPay);
    document.getElementById('amountToPay').textContent = formatPrice(totalToPay);

    window.toggleTransactionCode = function() {
      const selectedPayment = document.querySelector('input[name="payment"]:checked').value;
      document.getElementById('mobileMoneyInstructions').style.display = selectedPayment === 'cash_on_delivery' ? 'none' : 'block';
    };

    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnConfirmOrder');
      btn.textContent = 'Traitement en cours...';
      btn.disabled = true;

      try {
        const orderNumber = 'ZM-' + Date.now().toString().slice(-6);
        const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
        const transactionCode = document.getElementById('transactionCode').value || null;

        // A. Insérer la commande
        const { data: order, error: orderError } = await sb.from('orders').insert([{
          order_number: orderNumber,
          client_id: session.user.id,
          delivery_full_name: document.getElementById('deliveryName').value,
          delivery_phone: document.getElementById('deliveryPhone').value,
          delivery_city: document.getElementById('deliveryCity').value,
          delivery_commune: document.getElementById('deliveryCommune').value,
          delivery_address: document.getElementById('deliveryAddress').value,
          total_fcfa: totalToPay,
          status: 'new',
          payment_method: paymentMethod,
          transaction_code: transactionCode,
          payment_status: 'pending'
        }]).select().single();

        if (orderError) throw new Error("Erreur commande : " + orderError.message);

        // B. Insérer les articles
        const orderItemsData = cart.map(item => ({
          order_id: order.id,
          product_id: item.id,
          product_name: item.name,
          unit_price_fcfa: item.price,
          quantity: item.quantity,
          commission_fcfa: item.price * 0.10
        }));

        const { error: itemsError } = await sb.from('order_items').insert(orderItemsData);
        
        if (itemsError) {
          // Si les articles échouent, on supprime la commande pour ne pas avoir une commande vide
          await sb.from('orders').delete().eq('id', order.id);
          throw new Error("Erreur articles : " + itemsError.message);
        }

        localStorage.removeItem('zemar_cart');
        localStorage.removeItem('zemar_cart_count');

        window.location.href = `./order-success.html?num=${orderNumber}`;

      } catch (error) {
        console.error(error);
        alert("ÉCHEC : " + error.message);
        btn.textContent = 'Confirmer la commande';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
