<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajouter un produit — ZemarShop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/home.css" />
  <link rel="stylesheet" href="../css/pages/auth.css" />
</head>
<body style="background-color: var(--color-bg-alt);">

  <header class="navbar" id="navbar"></header>

  <main class="auth-page container" style="padding-top: 20px; padding-bottom: 40px;">
    <div class="auth-card" style="max-width: 700px;">
      
      <div class="auth-header" style="text-align: left; margin-bottom: 24px;">
        <a href="./dashboard.html" style="font-size: 14px; color: var(--color-text-soft); display: inline-flex; align-items: center; gap: 4px; margin-bottom: 12px;">
          ← Retour au tableau de bord
        </a>
        <h1>Ajouter un produit</h1>
        <p>Publiez un nouvel article dans votre boutique.</p>
      </div>

      <form id="addProductForm">
        
        <div class="field">
          <label class="field__label">Nom du produit</label>
          <input type="text" class="field__input" id="productName" placeholder="Ex: Robe africaine wax" required />
        </div>

        <div class="field" style="margin-top: 16px;">
          <label class="field__label">Catégorie</label>
          <select class="field__select" id="productCategory" required>
            <option value="">Chargement des catégories...</option>
          </select>
        </div>

        <div class="field" style="margin-top: 16px;">
          <label class="field__label">Type de variantes du produit</label>
          <select class="field__select" id="productVariantType" required>
            <option value="none">Aucune variante (Produit simple)</option>
            <option value="size">Tailles uniquement (ex: S, M, L)</option>
            <option value="color">Couleurs uniquement (ex: Rouge, Bleu)</option>
            <option value="size_color">Tailles ET Couleurs (ex: T-shirt)</option>
            <option value="weight">Poids uniquement (ex: 500g, 1kg)</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px;">
          <div class="field">
            <label class="field__label">Prix de vente (FCFA)</label>
            <input type="number" class="field__input" id="productPrice" placeholder="Ex: 15000" required min="100" />
          </div>
          <div class="field">
            <label class="field__label">Ancien prix (facultatif)</label>
            <input type="number" class="field__input" id="productOldPrice" placeholder="Ex: 20000" />
          </div>
        </div>

        <div class="field" style="margin-top: 16px;">
          <label class="field__label">Quantité en stock</label>
          <input type="number" class="field__input" id="productQuantity" placeholder="Ex: 10" required min="1" />
        </div>

        <div class="field" style="margin-top: 16px;">
          <label class="field__label">Photo principale du produit</label>
          <input type="file" class="field__input" id="productImageFile" accept="image/*" required style="padding: 8px;" />
        </div>

        <div class="field" style="margin-top: 16px;">
          <label class="field__label">Description du produit</label>
          <textarea class="field__textarea" id="productDescription" placeholder="Décrivez votre produit en détail..." required></textarea>
        </div>

        <div class="alert alert--info" style="margin-top: 24px;">
          <span>ℹ️</span>
          <div>
            <strong>Validation requise</strong><br>
            Votre produit sera examiné par un administrateur avant d'être mis en ligne.
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--lg btn--full" id="btnSubmit" style="margin-top: 24px;">
          Publier le produit
        </button>

      </form>

    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script type="module">
    import { renderNavbar } from '../js/ui/navbar.js';
    import { renderFooter } from '../js/ui/footer.js';
    import { initSupabase } from '../js/supabase-client.js';

    renderNavbar('vendor');
    renderFooter();

    let supabase;
    let currentShopId = null; // On va stocker l'ID de la vraie boutique ici

    async function init() {
      supabase = await initSupabase();
      if (!supabase) {
        alert("Erreur : impossible de se connecter à la base de données.");
        return;
      }

      // 1. Vérifier la session utilisateur
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = '../login.html';
        return;
      }

      // 2. Récupérer l'ID de SA boutique
      const { data: shop } = await supabase
        .from('shops')
        .select('id')
        .eq('owner_id', session.user.id)
        .single();

      if (!shop) {
        alert("Erreur : Vous n'avez pas de boutique.");
        window.location.href = './dashboard.html';
        return;
      }

      currentShopId = shop.id;

      // 3. Charger les catégories dans le menu déroulant
      const { data: categories } = await supabase.from('categories').select('*').order('name');
      const select = document.getElementById('productCategory');
      select.innerHTML = '<option value="">Sélectionnez une catégorie</option>';
      
      if (categories) {
        categories.forEach(cat => {
          const option = document.createElement('option');
          option.value = cat.id;
          option.textContent = cat.name;
          select.appendChild(option);
        });
      }
    }

    // 4. Gestion de la soumission du formulaire
    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const fileInput = document.getElementById('productImageFile');
      
      btn.textContent = 'Publication en cours...';
      btn.disabled = true;

      try {
        let imageUrl = null;

        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const fileExt = file.name.split('.').pop();
          const fileName = `${Date.now()}.${fileExt}`;

          const { error: uploadError } = await supabase.storage
            .from('product-images')
            .upload(fileName, file);

          if (uploadError) throw uploadError;

          const { data: urlData } = supabase.storage
            .from('product-images')
            .getPublicUrl(fileName);
          
          imageUrl = urlData.publicUrl;
        }

        const newProduct = {
          shop_id: currentShopId, // <-- Utilisation de la VRAIE boutique
          category_id: document.getElementById('productCategory').value,
          name: document.getElementById('productName').value,
          price_fcfa: parseFloat(document.getElementById('productPrice').value),
          old_price_fcfa: document.getElementById('productOldPrice').value ? parseFloat(document.getElementById('productOldPrice').value) : null,
          quantity: parseInt(document.getElementById('productQuantity').value, 10),
          image_url: imageUrl,
          description: document.getElementById('productDescription').value,
          variant_type: document.getElementById('productVariantType').value,
          status: 'pending' // Le produit doit être validé par l'admin
        };

        const { error: insertError } = await supabase.from('products').insert([newProduct]);
        if (insertError) throw insertError;

        alert("Produit ajouté avec succès ! Il est en attente de validation.");
        window.location.href = './dashboard.html';

      } catch (error) {
        console.error(error);
        alert("Erreur : " + error.message);
        btn.textContent = 'Publier le produit';
        btn.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
