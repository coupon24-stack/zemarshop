<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — ZemarShop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages/home.css" />
  <link rel="stylesheet" href="./css/pages/auth.css" />
</head>
<body style="background-color: var(--color-bg-alt);">

  <header class="navbar" id="navbar"></header>

  <main class="auth-page container">
    <div class="auth-card">
      
      <div class="auth-header">
        <h1>Connexion</h1>
        <p>Content de vous revoir sur ZemarShop !</p>
      </div>

      <!-- Zone de message (jaune pour le test) -->
      <div id="globalError" style="display: none; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; text-align: center; font-weight: bold;"></div>

      <form id="loginForm">
        
        <div class="field">
          <label class="field__label">Adresse e-mail</label>
          <input type="email" class="field__input" id="email" placeholder="votre@email.com" required />
        </div>

        <div class="field">
          <label class="field__label">Mot de passe</label>
          <input type="password" class="field__input" id="password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn--primary btn--lg btn--full" id="btnSubmit" style="margin-top: 16px;">
          Se connecter
        </button>

      </form>

      <div class="auth-footer">
        <p>Vous n'avez pas de compte ? <a href="./register-client.html">Créer un compte</a></p>
        <p style="margin-top: 8px; font-size: 12px;">Vous êtes un vendeur ? <a href="./register-vendor.html">Espace vendeur</a></p>
      </div>

    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script type="module">
    import { renderNavbar } from './js/ui/navbar.js';
    import { renderFooter } from './js/ui/footer.js';
    import { CONFIG } from './js/config.js';

    renderNavbar('login');
    renderFooter();

    async function doLogin() {
      const btn = document.getElementById('btnSubmit');
      const errorEl = document.getElementById('globalError');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // 1. Connexion à Supabase
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      const sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

      btn.textContent = 'Connexion en cours...';
      btn.disabled = true;
      errorEl.style.display = 'none';

      const { data: authData, error: authError } = await sb.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (authError) {
        errorEl.style.background = '#FEE2E2';
        errorEl.style.color = '#DC2626';
        errorEl.textContent = "Erreur : " + authError.message;
        errorEl.style.display = 'block';
        btn.textContent = 'Se connecter';
        btn.disabled = false;
        return;
      }

      // 2. Récupération du profil
      const { data: profile, error: profileError } = await sb
        .from('profiles')
        .select('role')
        .eq('id', authData.user.id)
        .single();

      if (profileError || !profile) {
        errorEl.style.background = '#FEE2E2';
        errorEl.style.color = '#DC2626';
        errorEl.textContent = "Profil introuvable : " + (profileError ? profileError.message : "Aucun profil.");
        errorEl.style.display = 'block';
        btn.textContent = 'Se connecter';
        btn.disabled = false;
        return;
      }

      // --- TEST VISUEL : On affiche le rôle en jaune ---
      errorEl.style.background = 'yellow';
      errorEl.style.color = 'black';
      errorEl.textContent = "Rôle détecté : " + profile.role;
      errorEl.style.display = 'block';
      
      // On attend 3 secondes pour que tu puisses lire
      await new Promise(r => setTimeout(r, 3000));

      // 3. Redirection
      if (profile.role === 'admin') {
        window.location.href = './admin/dashboard.html';
      } else if (profile.role === 'vendor') {
        window.location.href = './vendor/dashboard.html';
      } else {
        window.location.href = './client/dashboard.html';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      doLogin();
    });
  </script>
</body>
</html>
