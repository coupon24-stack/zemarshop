<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — ZemarShop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages/home.css" />
  <link rel="stylesheet" href="./css/pages/auth.css" />
</head>
<body style="background-color: var(--color-bg-alt);">

  <header class="navbar" id="navbar"></header>

  <main class="auth-page container">
    <div class="auth-card">
      
      <div class="auth-header">
        <h1>Connexion</h1>
        <p>Content de vous revoir sur ZemarShop !</p>
      </div>

      <form id="loginForm">
        
        <div class="field">
          <label class="field__label">Adresse e-mail</label>
          <input type="email" class="field__input" id="email" placeholder="votre@email.com" required />
        </div>

        <div class="field">
          <label class="field__label">Mot de passe</label>
          <input type="password" class="field__input" id="password" placeholder="••••••••" required />
        </div>

        <div class="auth-actions">
          <label class="auth-checkbox">
            <input type="checkbox" /> Se souvenir de moi
          </label>
          <a href="#" class="auth-link">Mot de passe oublié ?</a>
        </div>

        <!-- Zone d'erreur -->
        <div id="errorMsg" style="display: none; color: var(--color-danger); font-size: 14px; text-align: center; margin-bottom: 16px;"></div>

        <button type="submit" class="btn btn--primary btn--lg btn--full" id="btnSubmit">
          Se connecter
        </button>

      </form>

      <div class="auth-footer">
        <p>Vous n'avez pas de compte ? <a href="./register-client.html">Créer un compte</a></p>
        <p style="margin-top: 8px; font-size: 12px;">Vous êtes un vendeur ? <a href="./register-vendor.html">Espace vendeur</a></p>
      </div>

    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script type="module">
    import { renderNavbar } from './js/ui/navbar.js';
    import { renderFooter } from './js/ui/footer.js';
    import { initSupabase } from './js/supabase-client.js';

    renderNavbar('login');
    renderFooter();

    // Connexion à Supabase
    const sb = await initSupabase();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btnSubmit');
      const errorEl = document.getElementById('errorMsg');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      btn.textContent = 'Connexion en cours...';
      btn.disabled = true;
      errorEl.style.display = 'none';

      // 1. Authentification Supabase
      const { data, error } = await sb.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        errorEl.textContent = "Email ou mot de passe incorrect.";
        errorEl.style.display = 'block';
        btn.textContent = 'Se connecter';
        btn.disabled = false;
        return;
      }

      // 2. Connexion réussie : on récupère le rôle
      const { data: profile, error: profileError } = await sb
        .from('profiles')
        .select('role')
        .eq('id', data.user.id)
        .single();

      if (profileError || !profile) {
        errorEl.textContent = "Profil introuvable. Contactez le support.";
        errorEl.style.display = 'block';
        btn.textContent = 'Se connecter';
        btn.disabled = false;
        return;
      }

      // 3. Redirection intelligente selon le rôle
      console.log("Rôle de l'utilisateur connecté :", profile.role);

      if (profile.role === 'admin') {
        window.location.href = './admin/dashboard.html';
      } else if (profile.role === 'vendor') {
        window.location.href = './vendor/dashboard.html';
      } else {
        window.location.href = './client/dashboard.html';
      }
    });
  </script>
</body>
</html>
