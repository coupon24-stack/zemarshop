  <script type="module">
    import { renderNavbar, updateCartCount } from './js/ui/navbar.js';
    import { renderFooter } from './js/ui/footer.js';
    import { formatPrice } from './js/utils/format.js';

    renderNavbar('shop');
    renderFooter();

    const DELIVERY_FEE = 1500;
    let cart = [];

    try {
      const saved = localStorage.getItem('zemar_cart');
      if (saved) cart = JSON.parse(saved);
    } catch(e) { console.log(e); }

    if (cart.length === 0) {
      document.getElementById('emptyCart').classList.remove('hidden');
      document.getElementById('cartContent').classList.add('hidden');
    } else {
      document.getElementById('emptyCart').classList.add('hidden');
      document.getElementById('cartContent').classList.remove('hidden');
      renderCartItems();
    }

    function renderCartItems() {
      const listEl = document.getElementById('cartItemsList');
      listEl.innerHTML = cart.map(item => {
        return `
          <div class="cart-item">
            <img class="cart-item__image" src="${item.image || 'https://via.placeholder.com/150'}" alt="${item.name}" />
            <div class="cart-item__info">
              <div>
                <div class="cart-item__shop">${item.shop || 'Boutique Zemar'}</div>
                <h3 class="cart-item__name">${item.name}</h3>
                <p style="font-size: 12px; color: var(--color-text-soft); margin: 4px 0;">Couleur: ${item.color} | Taille: ${item.size}</p>
                <div class="cart-item__price">${formatPrice(item.price)}</div>
              </div>
              <div class="cart-item__actions">
                <div class="quantity-control">
                  <button onclick="window.changeQty('${item.uniqueId}', -1)">−</button>
                  <span>${item.quantity}</span>
                  <button onclick="window.changeQty('${item.uniqueId}', 1)">+</button>
                </div>
                <button class="cart-item__remove" onclick="window.removeItem('${item.uniqueId}')">🗑️ Supprimer</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
      updateTotals();
    }

    function updateTotals() {
      let subtotal = 0;
      cart.forEach(item => {
        subtotal += item.price * item.quantity;
      });
      const total = subtotal + DELIVERY_FEE;

      document.getElementById('subtotalPrice').textContent = formatPrice(subtotal);
      document.getElementById('deliveryPrice').textContent = formatPrice(DELIVERY_FEE);
      document.getElementById('totalPrice').textContent = formatPrice(total);
    }

    window.changeQty = function(uniqueId, delta) {
      const item = cart.find(i => i.uniqueId === uniqueId);
      if(!item) return;
      item.quantity += delta;
      if(item.quantity <= 0) cart = cart.filter(i => i.uniqueId !== uniqueId);
      
      localStorage.setItem('zemar_cart', JSON.stringify(cart));
      
      // Mise à jour du badge de la navbar
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      localStorage.setItem('zemar_cart_count', totalItems);
      updateCartCount(); // <-- LIGNE AJOUTÉE

      if (cart.length === 0) {
        document.getElementById('emptyCart').classList.remove('hidden');
        document.getElementById('cartContent').classList.add('hidden');
      } else {
        renderCartItems();
      }
    };

    window.removeItem = function(uniqueId) {
      cart = cart.filter(i => i.uniqueId !== uniqueId);
      localStorage.setItem('zemar_cart', JSON.stringify(cart));
      
      // Mise à jour du badge de la navbar
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      localStorage.setItem('zemar_cart_count', totalItems);
      updateCartCount(); // <-- LIGNE AJOUTÉE
      
      if (cart.length === 0) {
        document.getElementById('emptyCart').classList.remove('hidden');
        document.getElementById('cartContent').classList.add('hidden');
      } else {
        renderCartItems();
      }
    };
  </script>
