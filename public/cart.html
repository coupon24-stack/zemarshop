<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon Panier — ZemarShop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages/home.css" />
  <link rel="stylesheet" href="./css/pages/cart.css" />
</head>
<body>

  <header class="navbar" id="navbar"></header>

  <main class="cart-page container section">
    <h1 class="cart-page__title">Mon Panier</h1>

    <div id="emptyCart" class="cart-empty hidden">
      <div class="cart-empty__icon">🛒</div>
      <h2>Votre panier est vide</h2>
      <p>Découvrez nos produits et faites-vous plaisir !</p>
      <a href="./shop.html" class="btn btn--primary btn--lg">Découvrir la boutique</a>
    </div>

    <div id="cartContent" class="cart-content hidden">
      
      <div class="cart-items" id="cartItemsList">
        <!-- Les articles seront injectés ici par JS -->
      </div>

      <div class="cart-summary">
        <h2 class="cart-summary__title">Résumé</h2>
        
        <div class="cart-summary__row">
          <span>Sous-total</span>
          <span id="subtotalPrice">0 FCFA</span>
        </div>
        <div class="cart-summary__row">
          <span>Frais de livraison</span>
          <span id="deliveryPrice">1 500 FCFA</span>
        </div>
        <div class="cart-summary__row cart-summary__row--total">
          <span>Total</span>
          <span id="totalPrice">0 FCFA</span>
        </div>

        <a href="./checkout.html" class="btn btn--primary btn--lg btn--full" style="margin-top: 16px;">
          Passer la commande
        </a>
        <a href="./shop.html" class="cart-summary__continue">
          ← Continuer mes achats
        </a>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script type="module">
    import { renderNavbar, updateCartCount } from './js/ui/navbar.js';
    import { renderFooter } from './js/ui/footer.js';
    import { formatPrice } from './js/utils/format.js';

    renderNavbar('shop');
    renderFooter();

    const DELIVERY_FEE = 1500;
    let cart = [];

    // 1. On récupère le panier
    try {
      const saved = localStorage.getItem('zemar_cart');
      if (saved) cart = JSON.parse(saved);
    } catch(e) { console.log(e); }

    // 2. Affichage initial
    if (cart.length === 0) {
      document.getElementById('emptyCart').classList.remove('hidden');
      document.getElementById('cartContent').classList.add('hidden');
    } else {
      document.getElementById('emptyCart').classList.add('hidden');
      document.getElementById('cartContent').classList.remove('hidden');
      renderCartItems();
    }

    // 3. Affichage des articles
    function renderCartItems() {
      const listEl = document.getElementById('cartItemsList');
      listEl.innerHTML = cart.map(item => {
        return `
          <div class="cart-item">
            <img class="cart-item__image" src="${item.image || 'https://via.placeholder.com/150'}" alt="${item.name}" />
            <div class="cart-item__info">
              <div>
                <div class="cart-item__shop">${item.shop || 'Boutique Zemar'}</div>
                <h3 class="cart-item__name">${item.name}</h3>
                <p style="font-size: 12px; color: var(--color-text-soft); margin: 4px 0;">Couleur: ${item.color} | Taille: ${item.size}</p>
                <div class="cart-item__price">${formatPrice(item.price)}</div>
              </div>
              <div class="cart-item__actions">
                <div class="quantity-control">
                  <button onclick="window.changeQty('${item.uniqueId}', -1)">−</button>
                  <span>${item.quantity}</span>
                  <button onclick="window.changeQty('${item.uniqueId}', 1)">+</button>
                </div>
                <button class="cart-item__remove" onclick="window.removeItem('${item.uniqueId}')">🗑️ Supprimer</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
      updateTotals();
    }

    // 4. Calcul des totaux
    function updateTotals() {
      let subtotal = 0;
      cart.forEach(item => {
        subtotal += item.price * item.quantity;
      });
      const total = subtotal + DELIVERY_FEE;

      document.getElementById('subtotalPrice').textContent = formatPrice(subtotal);
      document.getElementById('deliveryPrice').textContent = formatPrice(DELIVERY_FEE);
      document.getElementById('totalPrice').textContent = formatPrice(total);
    }

    // 5. Fonctions pour les boutons
    window.changeQty = function(uniqueId, delta) {
      const item = cart.find(i => i.uniqueId === uniqueId);
      if(!item) return;
      item.quantity += delta;
      if(item.quantity <= 0) cart = cart.filter(i => i.uniqueId !== uniqueId);
      
      localStorage.setItem('zemar_cart', JSON.stringify(cart));
      
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      localStorage.setItem('zemar_cart_count', totalItems);
      updateCartCount();

      if (cart.length === 0) {
        document.getElementById('emptyCart').classList.remove('hidden');
        document.getElementById('cartContent').classList.add('hidden');
      } else {
        renderCartItems();
      }
    };

    window.removeItem = function(uniqueId) {
      cart = cart.filter(i => i.uniqueId !== uniqueId);
      localStorage.setItem('zemar_cart', JSON.stringify(cart));
      
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      localStorage.setItem('zemar_cart_count', totalItems);
      updateCartCount();
      
      if (cart.length === 0) {
        document.getElementById('emptyCart').classList.remove('hidden');
        document.getElementById('cartContent').classList.add('hidden');
      } else {
        renderCartItems();
      }
    };
  </script>
</body>
</html>
