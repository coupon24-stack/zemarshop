<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boutique — ZemarShop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages/home.css" />
  <link rel="stylesheet" href="./css/pages/shop.css" />
</head>
<body>

  <header class="navbar" id="navbar"></header>

  <section class="shop-header">
    <div class="container">
      <h1>Tous les produits</h1>
      <p>Découvrez notre sélection de produits.</p>
    </div>
  </section>

  <section class="shop-toolbar">
    <div class="container">
      <form class="search-form" onsubmit="event.preventDefault();">
        <div class="search-form__field">
          <svg class="search-form__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
          </svg>
          <!-- ID AJOUTÉ ICI -->
          <input type="search" id="searchInput" placeholder="Rechercher dans la boutique..." />
        </div>
        <button type="submit" class="btn btn--primary">Rechercher</button>
      </form>

      <div class="sort-wrapper">
        <label>Trier par :</label>
        <!-- ID AJOUTÉ ICI -->
        <select class="field__select" id="sortSelect">
          <option value="new">Nouveautés</option>
          <option value="popular">Populaires</option>
          <option value="price_asc">Prix croissant</option>
          <option value="price_desc">Prix décroissant</option>
        </select>
      </div>
    </div>
  </section>

  <!-- Filtres Catégories -->
  <section class="shop-filters">
    <div class="container">
      <div class="filters-scroll" id="filtersScroll">
        <!-- Les boutons de filtres seront injectés par JS -->
      </div>
    </div>
  </section>

  <section class="shop-products section">
    <div class="container">
      <div class="products-grid" id="shopGrid">
        <!-- Les produits seront injectés par JS -->
      </div>
      <div id="noResults" class="hidden" style="text-align:center; padding: 40px; color: var(--color-text-soft);">
        Aucun produit trouvé pour votre recherche.
      </div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>

  <!-- On utilise le script shop.js qui gère la recherche et les filtres -->
  <script type="module" src="./js/pages/shop.js"></script>
</body>
</html>
