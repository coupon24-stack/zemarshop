<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détail du produit — ZemarShop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages/home.css" />
  <link rel="stylesheet" href="./css/pages/product.css" />
</head>
<body>

  <header class="navbar" id="navbar"></header>

  <div class="container" style="margin-top: 16px; display: flex; justify-content: space-between; align-items: center;">
    <button onclick="history.back();" 
            style="display: inline-flex; align-items: center; gap: 8px; background: none; border: none; color: #64748B; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Retour
    </button>

    <!-- BOUTON PARTAGER -->
    <button onclick="shareProduct()" 
            style="display: inline-flex; align-items: center; gap: 8px; background: none; border: none; color: var(--color-primary); font-size: 14px; font-weight: 600; cursor: pointer; padding: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
      </svg>
      Partager
    </button>
  </div>

  <main class="product-detail container section" id="productContent" style="visibility: hidden; opacity: 0; transition: opacity 0.3s ease; margin-top: 0; padding-top: 16px;">
    
    <div class="product-gallery">
      <div class="product-gallery__main">
        <img id="productImage" src="" alt="Image du produit" />
      </div>
      <div class="product-gallery__thumbs">
        <div class="thumb is-active"><img id="thumb1" src="" alt="Miniature 1" /></div>
      </div>
    </div>

    <div class="product-info">
      <div class="product-info__shop" id="productShop">Chargement...</div>
      <h1 class="product-info__title" id="productTitle">Chargement...</h1>
      
      <div class="product-info__prices">
        <span class="price-current" id="productPrice">0 FCFA</span>
        <span class="price-old" id="productOldPrice"></span>
        <span class="badge badge--discount" id="productDiscount" style="display:none;"></span>
      </div>

      <p class="product-info__desc" id="productDesc">Chargement...</p>

      <div class="product-variants" id="variantsContainer" style="display: none;">
        <div class="variant-group" id="colorGroup" style="display: none;">
          <span class="variant-label">Couleur</span>
          <div class="variant-options" id="colorOptions">
            <button class="variant-btn is-active" style="background:#222" onclick="selectColor('Noir', this)"></button>
            <button class="variant-btn" style="background:#E60023" onclick="selectColor('Rouge', this)"></button>
            <button class="variant-btn" style="background:#1E4FA8" onclick="selectColor('Bleu', this)"></button>
          </div>
        </div>
        
        <div class="variant-group" id="sizeGroup" style="display: none;">
          <span class="variant-label">Taille</span>
          <div class="variant-options" id="sizeOptions">
            <button class="variant-btn is-active" onclick="selectSize('S', this)">S</button>
            <button class="variant-btn" onclick="selectSize('M', this)">M</button>
            <button class="variant-btn" onclick="selectSize('L', this)">L</button>
          </div>
        </div>

        <div class="variant-group" id="weightGroup" style="display: none;">
          <span class="variant-label">Poids</span>
          <div class="variant-options" id="weightOptions">
            <button class="variant-btn is-active" onclick="selectSize('500g', this)">500g</button>
            <button class="variant-btn" onclick="selectSize('1kg', this)">1kg</button>
            <button class="variant-btn" onclick="selectSize('2kg', this)">2kg</button>
          </div>
        </div>
      </div>

      <div class="product-actions">
        <button class="btn btn--outline btn--lg" id="btnAddToCart">Ajouter au panier</button>
        <button class="btn btn--primary btn--lg" id="btnBuyNow">Commander maintenant</button>
      </div>
    </div>
  </main>

  <!-- NOUVELLE SECTION : AVIS CLIENTS -->
  <section class="section section--alt">
    <div class="container" style="max-width: 800px;">
      <h2 style="font-size: 22px; margin-bottom: 24px;">Avis clients</h2>

      <!-- Formulaire d'avis BLOQUÉ -->
      <div style="background: white; padding: 24px; border-radius: 16px; box-shadow: var(--shadow-sm); margin-bottom: 32px; text-align: center;">
        <div style="font-size: 32px; margin-bottom: 12px;">🔒</div>
        <h3 style="font-size: 16px; margin-bottom: 8px;">Vous avez acheté ce produit ?</h3>
        <p style="color: var(--color-text-soft); font-size: 14px; margin-bottom: 16px;">
          Seuls les clients ayant reçu cette commande peuvent laisser un avis. 
          Connectez-vous pour vérifier votre éligibilité.
        </p>
        <a href="./login.html" class="btn btn--primary btn--sm">Se connecter pour donner un avis</a>
      </div>

      <!-- Liste des avis -->
      <div id="reviewsList">
        <p style="color: var(--color-text-soft);">Chargement des avis...</p>
      </div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>

  <script type="module">
    import { renderNavbar } from './js/ui/navbar.js';
    import { renderFooter } from './js/ui/footer.js';
    import { initSupabase } from './js/supabase-client.js';
    import { formatPrice } from './js/utils/format.js';

    renderNavbar('shop'); 
    renderFooter();

    let product = null;
    let sb = null;

    async function init() {
      sb = await initSupabase();
      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id');

      if (!productId) {
        document.getElementById('productTitle').textContent = "Produit introuvable";
        return;
      }

      const { data, error } = await sb
        .from('products')
        .select(`id, name, description, price_fcfa, old_price_fcfa, image_url, variant_type, shops ( name )`)
        .eq('id', productId)
        .single();

      if (error || !data) {
        document.getElementById('productTitle').textContent = "Produit introuvable";
        return;
      }

      product = data;

      const img = product.image_url || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600';
      document.getElementById('productImage').src = img;
      document.getElementById('thumb1').src = img;
      
      document.getElementById('productShop').textContent = product.shops?.name || 'Boutique Zemar';
      document.getElementById('productTitle').textContent = product.name;
      document.getElementById('productPrice').textContent = formatPrice(product.price_fcfa);
      document.getElementById('productDesc').textContent = product.description;
      
      if (product.old_price_fcfa) {
        document.getElementById('productOldPrice').textContent = formatPrice(product.old_price_fcfa);
        const discount = Math.round(((product.old_price_fcfa - product.price_fcfa) / product.old_price_fcfa) * 100);
        document.getElementById('productDiscount').textContent = `-${discount}%`;
        document.getElementById('productDiscount').style.display = 'inline-flex';
      }

      const type = product.variant_type || 'none';
      if (type !== 'none') document.getElementById('variantsContainer').style.display = 'flex';
      if (type === 'size' || type === 'size_color') document.getElementById('sizeGroup').style.display = 'block';
      if (type === 'color' || type === 'size_color') document.getElementById('colorGroup').style.display = 'block';
      if (type === 'weight') document.getElementById('weightGroup').style.display = 'block';

      const content = document.getElementById('productContent');
      content.style.visibility = 'visible';
      content.style.opacity = '1';

      // Charger les avis
      loadReviews(productId);
    }

    // --- GESTION DE L'AFFICHAGE DES AVIS ---
    async function loadReviews(productId) {
      const { data: reviews, error } = await sb
        .from('reviews')
        .select('*')
        .eq('product_id', productId)
        .order('created_at', { ascending: false });

      const list = document.getElementById('reviewsList');
      
      if (error || !reviews || reviews.length === 0) {
        list.innerHTML = '<p style="color: var(--color-text-soft); text-align: center;">Aucun avis pour le moment.</p>';
        return;
      }

      list.innerHTML = reviews.map(r => {
        const stars = '⭐'.repeat(r.rating);
        return `
          <div style="background: white; padding: 16px; border-radius: 12px; margin-bottom: 12px; box-shadow: var(--shadow-sm);">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
              <strong>${r.client_name}</strong>
              <span style="font-size: 12px; color: var(--color-text-soft);">${new Date(r.created_at).toLocaleDateString('fr-FR')}</span>
            </div>
            <div style="margin-bottom: 8px;">${stars}</div>
            <p style="font-size: 14px; color: var(--color-text-soft); margin: 0;">${r.comment}</p>
          </div>
        `;
      }).join('');
    }

    // --- PARTAGE ---
    window.shareProduct = function() {
      const shareData = {
        title: product ? product.name : 'ZemarShop',
        text: 'Regarde ce produit sur ZemarShop !',
        url: window.location.href
      };

      if (navigator.share) {
        navigator.share(shareData).catch(console.error);
      } else {
        alert("Copiez ce lien pour partager : " + window.location.href);
      }
    };

    // --- VARIANTES & PANIER ---
    let selectedColor = 'Défaut';
    let selectedSize = 'Défaut';

    window.selectColor = function(color, btn) {
      selectedColor = color;
      document.querySelectorAll('#colorOptions .variant-btn').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
    };

    window.selectSize = function(size, btn) {
      selectedSize = size;
      document.querySelectorAll('#sizeOptions .variant-btn, #weightOptions .variant-btn').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
    };

    function addToCart() {
      if (!product) return;
      let cart = JSON.parse(localStorage.getItem('zemar_cart') || '[]');
      const uniqueId = `${product.id}-${selectedColor}-${selectedSize}`;
      
      const existingItem = cart.find(item => item.uniqueId === uniqueId);
      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({ 
          id: product.id, uniqueId: uniqueId, name: product.name, price: product.price_fcfa,
          image: product.image_url, shop: product.shops?.name,
          color: selectedColor, size: selectedSize, quantity: 1 
        });
      }
      
      localStorage.setItem('zemar_cart', JSON.stringify(cart));
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      localStorage.setItem('zemar_cart_count', totalItems);
      
      const badge = document.getElementById('cartCount');
      if (badge) {
        badge.textContent = totalItems;
        badge.style.display = 'flex';
        badge.classList.add('is-visible');
      }
    }

    document.getElementById('btnAddToCart').addEventListener('click', function(e) {
      const btn = e.currentTarget;
      addToCart();
      const originalText = btn.innerHTML;
      btn.innerHTML = '✓ Ajouté !';
      btn.style.backgroundColor = '#16A34A'; 
      btn.style.color = '#fff';
      btn.style.borderColor = '#16A34A';
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.style.backgroundColor = '';
        btn.style.color = '';
        btn.style.borderColor = '';
      }, 2000);
    });

    document.getElementById('btnBuyNow').addEventListener('click', function() {
      addToCart();
      window.location.href = './cart.html';
    });

    init();
  </script>
</body>
</html>
