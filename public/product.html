<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détail du produit — ZemarShop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages/home.css" />
  <link rel="stylesheet" href="./css/pages/product.css" />
</head>
<body>

  <header class="navbar" id="navbar"></header>

  <div class="container" style="margin-top: 16px;">
    <button onclick="history.back();" 
            style="display: inline-flex; align-items: center; gap: 8px; background: none; border: none; color: #64748B; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Retour
    </button>
  </div>

  <main class="product-detail container section" id="productContent" style="visibility: hidden; opacity: 0; transition: opacity 0.3s ease; margin-top: 0; padding-top: 16px;">
    
    <div class="product-gallery">
      <div class="product-gallery__main">
        <img id="productImage" src="" alt="Image du produit" />
      </div>
      <div class="product-gallery__thumbs">
        <div class="thumb is-active"><img id="thumb1" src="" alt="Miniature 1" /></div>
        <div class="thumb"><img id="thumb2" src="" alt="Miniature 2" /></div>
        <div class="thumb"><img id="thumb3" src="" alt="Miniature 3" /></div>
      </div>
    </div>

    <div class="product-info">
      <div class="product-info__shop" id="productShop">Chargement...</div>
      <h1 class="product-info__title" id="productTitle">Chargement...</h1>
      
      <div class="product-info__prices">
        <span class="price-current" id="productPrice">0 FCFA</span>
        <span class="price-old" id="productOldPrice"></span>
        <span class="badge badge--discount" id="productDiscount" style="display:none;"></span>
      </div>

      <p class="product-info__desc" id="productDesc">
        Chargement de la description...
      </p>

      <div class="product-variants">
        <div class="variant-group">
          <span class="variant-label">Couleur</span>
          <div class="variant-options" id="colorOptions">
            <button class="variant-btn is-active" style="background:#222" onclick="selectColor('Noir', this)"></button>
            <button class="variant-btn" style="background:#E60023" onclick="selectColor('Rouge', this)"></button>
            <button class="variant-btn" style="background:#1E4FA8" onclick="selectColor('Bleu', this)"></button>
          </div>
        </div>
        
        <div class="variant-group">
          <span class="variant-label">Taille</span>
          <div class="variant-options" id="sizeOptions">
            <button class="variant-btn is-active" onclick="selectSize('S', this)">S</button>
            <button class="variant-btn" onclick="selectSize('M', this)">M</button>
            <button class="variant-btn" onclick="selectSize('L', this)">L</button>
          </div>
        </div>
      </div>

      <div class="product-actions">
        <button class="btn btn--outline btn--lg" id="btnAddToCart">Ajouter au panier</button>
        <button class="btn btn--primary btn--lg" id="btnBuyNow">Commander maintenant</button>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script type="module">
    import { renderNavbar } from './js/ui/navbar.js';
    import { renderFooter } from './js/ui/footer.js';
    import { initSupabase } from './js/supabase-client.js';
    import { formatPrice } from './js/utils/format.js';

    renderNavbar('shop'); 
    renderFooter();

    let product = null;

    async function init() {
      const sb = await initSupabase();
      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id');

      if (!productId) {
        document.getElementById('productTitle').textContent = "Produit introuvable";
        return;
      }

      // ON CHERCHE LE PRODUIT DANS LA VRAIE BASE DE DONNÉES
      const { data, error } = await sb
        .from('products')
        .select(`id, name, description, price_fcfa, old_price_fcfa, image_url, shops ( name )`)
        .eq('id', productId)
        .single();

      if (error || !data) {
        console.error(error);
        document.getElementById('productTitle').textContent = "Produit introuvable";
        document.getElementById('productDesc').textContent = "Désolé, ce produit n'existe pas ou n'est plus disponible.";
        return;
      }

      product = data;

      // Remplissage de la page
      const img = product.image_url || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600';
      
      document.getElementById('productImage').src = img;
      document.getElementById('thumb1').src = img;
      document.getElementById('thumb2').src = img;
      document.getElementById('thumb3').src = img;
      
      document.getElementById('productShop').textContent = product.shops?.name || 'Boutique Zemar';
      document.getElementById('productTitle').textContent = product.name;
      document.getElementById('productPrice').textContent = formatPrice(product.price_fcfa);
      document.getElementById('productDesc').textContent = product.description;
      
      if (product.old_price_fcfa) {
        document.getElementById('productOldPrice').textContent = formatPrice(product.old_price_fcfa);
        const discount = Math.round(((product.old_price_fcfa - product.price_fcfa) / product.old_price_fcfa) * 100);
        document.getElementById('productDiscount').textContent = `-${discount}%`;
        document.getElementById('productDiscount').style.display = 'inline-flex';
      } else {
        document.getElementById('productOldPrice').style.display = 'none';
        document.getElementById('productDiscount').style.display = 'none';
      }

      // Afficher la page une fois chargée
      const content = document.getElementById('productContent');
      content.style.visibility = 'visible';
      content.style.opacity = '1';
    }

    // --- VARIABLES POUR LES CHOIX ---
    let selectedColor = 'Noir';
    let selectedSize = 'S';

    window.selectColor = function(color, btn) {
      selectedColor = color;
      document.querySelectorAll('#colorOptions .variant-btn').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
    };

    window.selectSize = function(size, btn) {
      selectedSize = size;
      document.querySelectorAll('#sizeOptions .variant-btn').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
    };

    function addToCart() {
      if (!product) return;
      
      let cart = JSON.parse(localStorage.getItem('zemar_cart') || '[]');
      const uniqueId = `${product.id}-${selectedColor}-${selectedSize}`;
      
      const existingItem = cart.find(item => item.uniqueId === uniqueId);
      
      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({ 
          id: product.id, 
          uniqueId: uniqueId,
          name: product.name,
          price: product.price_fcfa,
          image: product.image_url,
          shop: product.shops?.name,
          color: selectedColor,
          size: selectedSize,
          quantity: 1 
        });
      }
      
      localStorage.setItem('zemar_cart', JSON.stringify(cart));
      
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      localStorage.setItem('zemar_cart_count', totalItems);
      
      const badge = document.getElementById('cartCount');
      if (badge) {
        badge.textContent = totalItems;
        badge.style.display = 'flex'; // <-- LIGNE AJOUTÉE POUR FORCER L'AFFICHAGE
        badge.classList.add('is-visible');
      }
    }

    document.getElementById('btnAddToCart').addEventListener('click', function(e) {
      const btn = e.currentTarget;
      addToCart();
      
      const originalText = btn.innerHTML;
      btn.innerHTML = '✓ Ajouté !';
      btn.style.backgroundColor = '#16A34A'; 
      btn.style.color = '#fff';
      btn.style.borderColor = '#16A34A';
      
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.style.backgroundColor = '';
        btn.style.color = '';
        btn.style.borderColor = '';
      }, 2000);
    });

    document.getElementById('btnBuyNow').addEventListener('click', function() {
      addToCart();
      window.location.href = './cart.html';
    });

    init();
  </script>
</body>
</html>
