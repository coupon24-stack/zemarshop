<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détail du produit — ZemarShop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages/home.css" />
  <link rel="stylesheet" href="./css/pages/product.css" />
</head>
<body>

  <header class="navbar" id="navbar"></header>

  <div class="container" style="margin-top: 16px;">
    <button onclick="history.back();" 
            style="display: inline-flex; align-items: center; gap: 8px; background: none; border: none; color: #64748B; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Retour
    </button>
  </div>

  <main class="product-detail container section" id="productContent" style="visibility: hidden; opacity: 0; transition: opacity 0.3s ease; margin-top: 0; padding-top: 16px;">
    
    <div class="product-gallery">
      <div class="product-gallery__main">
        <img id="productImage" src="" alt="Image du produit" />
      </div>
      <div class="product-gallery__thumbs">
        <div class="thumb is-active"><img id="thumb1" src="" alt="Miniature 1" /></div>
        <div class="thumb"><img id="thumb2" src="" alt="Miniature 2" /></div>
        <div class="thumb"><img id="thumb3" src="" alt="Miniature 3" /></div>
      </div>
    </div>

    <div class="product-info">
      <div class="product-info__shop" id="productShop"></div>
      <h1 class="product-info__title" id="productTitle"></h1>
      
      <div class="product-info__prices">
        <span class="price-current" id="productPrice"></span>
        <span class="price-old" id="productOldPrice"></span>
        <span class="badge badge--discount" id="productDiscount" style="display:none;"></span>
      </div>

      <p class="product-info__desc" id="productDesc">
        Un produit de qualité supérieure, disponible exclusivement sur ZemarShop.
      </p>

      <div class="product-variants">
        <div class="variant-group">
          <span class="variant-label">Couleur</span>
          <div class="variant-options">
            <button class="variant-btn is-active" style="background:#222"></button>
            <button class="variant-btn" style="background:#E60023"></button>
            <button class="variant-btn" style="background:#1E4FA8"></button>
          </div>
        </div>
        
        <div class="variant-group">
          <span class="variant-label">Taille</span>
          <div class="variant-options">
            <button class="variant-btn is-active">S</button>
            <button class="variant-btn">M</button>
            <button class="variant-btn">L</button>
          </div>
        </div>
      </div>

      <div class="product-actions">
        <button class="btn btn--outline btn--lg" id="btnAddToCart">Ajouter au panier</button>
        <button class="btn btn--primary btn--lg">Commander maintenant</button>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script type="module">
    import { renderNavbar } from './js/ui/navbar.js';
    import { renderFooter } from './js/ui/footer.js';
    import { formatPrice } from './js/utils/format.js';

    renderNavbar('shop'); 
    renderFooter();

    const productsDB = {
      'p1': { id: 'p1', name: 'Robe africaine wax élégante', price: 15000, oldPrice: 20000, shop: 'Boutique Awa', image: 'https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=600' },
      'p2': { id: 'p2', name: 'Sneakers blanches homme', price: 22500, oldPrice: null, shop: 'Kicks CI', image: 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=600' },
      'p3': { id: 'p3', name: 'Sac à main cuir premium', price: 18000, oldPrice: 24000, shop: 'Élégance Shop', image: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600' },
      'p4': { id: 'p4', name: 'Casque Bluetooth sans fil', price: 12500, oldPrice: 15000, shop: 'TechZone', image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600' },
      'p5': { id: 'p5', name: 'Montre connectée sport', price: 32000, oldPrice: null, shop: 'Gadget CI', image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600' },
      'p6': { id: 'p6', name: 'Parfum femme délicat', price: 9500, oldPrice: 13000, shop: 'Beauty Store', image: 'https://images.unsplash.com/photo-1541643600914-78b084683601?w=600' },
      'p7': { id: 'p7', name: 'Smartphone Android 128Go', price: 85000, oldPrice: 95000, shop: 'Phone City', image: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600' },
      'p8': { id: 'p8', name: 'Lampe déco design moderne', price: 7500, oldPrice: null, shop: 'Maison & Co', image: 'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=600' }
    };

    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    const product = productsDB[productId] || productsDB['p1'];

    document.getElementById('productImage').src = product.image;
    document.getElementById('thumb1').src = product.image;
    document.getElementById('thumb2').src = product.image;
    document.getElementById('thumb3').src = product.image;
    
    document.getElementById('productShop').textContent = product.shop;
    document.getElementById('productTitle').textContent = product.name;
    document.getElementById('productPrice').textContent = formatPrice(product.price);
    
    if (product.oldPrice) {
      document.getElementById('productOldPrice').textContent = formatPrice(product.oldPrice);
      const discount = Math.round(((product.oldPrice - product.price) / product.oldPrice) * 100);
      document.getElementById('productDiscount').textContent = `-${discount}%`;
      document.getElementById('productDiscount').style.display = 'inline-flex';
    } else {
      document.getElementById('productOldPrice').style.display = 'none';
      document.getElementById('productDiscount').style.display = 'none';
    }

    // GESTION DU PANIER (SANS ALERTE)
    document.getElementById('btnAddToCart').addEventListener('click', function(e) {
      const btn = e.currentTarget;
      
      // 1. On récupère le panier actuel
      let cart = JSON.parse(localStorage.getItem('zemar_cart') || '[]');
      
      // 2. On cherche si le produit y est déjà
      const existingItem = cart.find(item => item.id === product.id);
      
      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({ id: product.id, quantity: 1 });
      }
      
      // 3. On sauvegarde
      localStorage.setItem('zemar_cart', JSON.stringify(cart));
      
      // 4. On met à jour le badge dans la navbar
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      localStorage.setItem('zemar_cart_count', totalItems);
      const badge = document.getElementById('cartCount');
      if (badge) {
        badge.textContent = totalItems;
        badge.classList.add('is-visible');
      }
      
      // 5. Feedback visuel (le bouton change de texte et de couleur 2 secondes)
      const originalText = btn.innerHTML;
      btn.innerHTML = '✓ Ajouté !';
      btn.style.backgroundColor = '#16A34A'; // Vert
      btn.style.color = '#fff';
      btn.style.borderColor = '#16A34A';
      
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.style.backgroundColor = '';
        btn.style.color = '';
        btn.style.borderColor = '';
      }, 2000);
    });

    // Afficher la page
    const content = document.getElementById('productContent');
    content.style.visibility = 'visible';
    content.style.opacity = '1';
  </script>
</body>
</html>
