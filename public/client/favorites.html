<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes Favoris — ZemarShop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/home.css" />
  <link rel="stylesheet" href="../css/pages/client.css" />
</head>
<body style="background-color: var(--color-bg-alt);">

  <header class="navbar" id="navbar"></header>

  <main class="container section">
    <div class="client-layout">
      
      <aside class="client-sidebar">
        <a href="./dashboard.html" class="client-nav-link">Tableau de bord</a>
        <a href="./orders.html" class="client-nav-link">Mes commandes</a>
        <a href="./favorites.html" class="client-nav-link active">Mes favoris</a>
        <a href="./addresses.html" class="client-nav-link">Mes adresses</a>
        <a href="./profile.html" class="client-nav-link">Mon profil</a>
        <hr style="margin: 12px 0; border: none; border-top: 1px solid var(--color-border);">
        <a href="#" class="client-nav-link" id="btnLogout" style="color: var(--color-danger);">Déconnexion</a>
      </aside>

      <div class="client-content">
        <h2 class="section-title" style="margin-bottom: 24px;">Mes Favoris</h2>
        <div class="products-grid" id="favoritesGrid">
          <p style="color: var(--color-text-soft);">Chargement de vos favoris...</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script type="module">
    import { renderNavbar } from '../js/ui/navbar.js';
    import { renderFooter } from '../js/ui/footer.js';
    import { initSupabase } from '../js/supabase-client.js';
    import { formatPrice } from '../js/utils/format.js';

    renderNavbar('client');
    renderFooter();

    async function loadFavorites() {
      const sb = await initSupabase();
      const { data: { session } } = await sb.auth.getSession();
      
      if (!session) {
        window.location.href = '../login.html';
        return;
      }

      // Récupérer les favoris avec les infos des produits
      const { data: favorites, error } = await sb
        .from('favorites')
        .select('*, products ( id, name, price_fcfa, image_url, shops ( name ) )')
        .eq('client_id', session.user.id);

      const grid = document.getElementById('favoritesGrid');

      if (error || !favorites || favorites.length === 0) {
        grid.innerHTML = '<p style="color: var(--color-text-soft);">Vous n\'avez pas encore de favoris.</p>';
        return;
      }

      grid.innerHTML = favorites.map(f => {
        const p = f.products;
        if (!p) return '';
        return `
          <article class="product-card">
            <div class="product-card__image-wrap" onclick="window.location.href='../product.html?id=${p.id}'" style="cursor: pointer;">
              <img class="product-card__image" src="${p.image_url}" alt="${p.name}" />
            </div>
            <div class="product-card__body">
              <div class="product-card__shop">${p.shops?.name || 'Boutique'}</div>
              <h3 class="product-card__name">${p.name}</h3>
              <div class="product-card__prices">
                <span class="product-card__price">${formatPrice(p.price_fcfa)}</span>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    document.getElementById('btnLogout').addEventListener('click', async (e) => {
      e.preventDefault();
      const sb = await initSupabase();
      await sb.auth.signOut();
      window.location.href = '../index.html';
    });

    loadFavorites();
  </script>
</body>
</html>
