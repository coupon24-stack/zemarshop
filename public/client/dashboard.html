<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon Espace — ZemarShop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/home.css" />
  <link rel="stylesheet" href="../css/pages/client.css" />
</head>
<body style="background-color: var(--color-bg-alt);">

  <header class="navbar" id="navbar"></header>

  <main class="container section">
    <!-- En-tête du profil -->
    <div class="client-header">
      <div class="client-avatar" id="userAvatar">...</div>
      <div class="client-info">
        <h1 id="userName">Chargement...</h1>
        <p id="userEmail">Chargement...</p>
      </div>
    </div>

    <div class="client-layout">
      <!-- Menu de gauche -->
      <aside class="client-sidebar">
        <a href="#" class="client-nav-link active">Tableau de bord</a>
        <a href="#" class="client-nav-link">Mes commandes</a>
        <a href="#" class="client-nav-link">Mes favoris</a>
        <a href="#" class="client-nav-link">Mes adresses</a>
        <a href="#" class="client-nav-link">Mon profil</a>
        <hr style="margin: 12px 0; border: none; border-top: 1px solid var(--color-border);">
        <!-- Bouton de déconnexion -->
        <a href="#" class="client-nav-link" id="btnLogout" style="color: var(--color-danger);">Déconnexion</a>
      </aside>

      <!-- Contenu principal -->
      <div class="client-content">
        
        <div class="client-stats">
          <div class="stat-card">
            <span class="stat-icon">📦</span>
            <div>
              <strong>0</strong>
              <span>Commandes</span>
            </div>
          </div>
          <div class="stat-card">
            <span class="stat-icon">❤️</span>
            <div>
              <strong>0</strong>
              <span>Favoris</span>
            </div>
          </div>
        </div>

        <div class="client-section">
          <h2>Dernières commandes</h2>
          <p style="color: var(--color-text-soft); font-size: 14px;">Vous n'avez pas encore passé de commande.</p>
        </div>

      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script type="module">
    import { renderNavbar } from '../js/ui/navbar.js';
    import { renderFooter } from '../js/ui/footer.js';
    import { initSupabase } from '../js/supabase-client.js';

    renderNavbar('client');
    renderFooter();

    async function checkUser() {
      const sb = await initSupabase();
      
      // 1. On demande à Supabase si quelqu'un est connecté
      const { data: { session }, error: sessionError } = await sb.auth.getSession();

      if (sessionError || !session) {
        // Si personne n'est connecté, on renvoie vers la page de login
        window.location.href = '../login.html';
        return;
      }

      // 2. On récupère le profil (nom, email) dans la base de données
      const { data: profile, error: profileError } = await sb
        .from('profiles')
        .select('full_name, email')
        .eq('id', session.user.id)
        .single();

      // Si erreur ou si le profil n'existe pas (ex: trigger raté)
      if (profileError || !profile) {
        document.getElementById('userName').textContent = "Profil introuvable";
        document.getElementById('userEmail').textContent = "Veuillez contacter le support.";
        document.getElementById('userAvatar').textContent = "?";
        console.error("Erreur profil :", profileError);
        return;
      }

      // 3. On affiche les vraies données
      document.getElementById('userName').textContent = "Bonjour, " + (profile.full_name || 'Utilisateur') + " 👋";
      document.getElementById('userEmail').textContent = profile.email || session.user.email;
      
      // Créer les initiales
      const initials = (profile.full_name || 'U')
        .split(' ')
        .map(n => n[0])
        .join('')
        .toUpperCase()
        .substring(0, 2);
      
      document.getElementById('userAvatar').textContent = initials;
    }

    // 4. Gestion de la déconnexion
    document.getElementById('btnLogout').addEventListener('click', async (e) => {
      e.preventDefault();
      const sb = await initSupabase();
      await sb.auth.signOut();
      window.location.href = '../index.html';
    });

    checkUser();
  </script>
</body>
</html>
