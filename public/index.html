<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZemarShop — Design System</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>

  <div class="container" style="padding: 40px 16px;">
    <h1>Test du <span class="text-gradient">Design System</span></h1>
    <p>Si tu vois de belles couleurs et des boutons arrondis, c'est gagné ✅</p>

    <section class="section">
      <h2>Boutons</h2>
      <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px;">
        <button class="btn btn--primary">Bouton principal</button>
        <button class="btn btn--outline">Bouton contour</button>
        <button class="btn btn--ghost">Bouton fantôme</button>
        <button class="btn btn--primary btn--lg">Grand bouton</button>
      </div>
    </section>

    <section class="section">
      <h2>Badges</h2>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px;">
        <span class="badge">Standard</span>
        <span class="badge badge--success">Succès</span>
        <span class="badge badge--warning">Attention</span>
        <span class="badge badge--danger">Erreur</span>
        <span class="badge badge--discount">-25%</span>
      </div>
    </section>

    <section class="section">
      <h2>Carte produit</h2>
      <div class="products-grid" style="margin-top: 16px;">
        <article class="product-card">
          <div class="product-card__image-wrap">
            <img class="product-card__image"
                 src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"
                 alt="Casque Bluetooth" />
            <div class="product-card__badges">
              <span class="badge badge--discount">-17%</span>
            </div>
            <button class="product-card__favorite" aria-label="Favori">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </button>
          </div>
          <div class="product-card__body">
            <div class="product-card__shop">TechZone</div>
            <h3 class="product-card__name">Casque Bluetooth sans fil</h3>
            <div class="product-card__prices">
              <span class="product-card__price">12 500 FCFA</span>
              <span class="product-card__old-price">15 000 FCFA</span>
            </div>
            <div class="product-card__actions">
              <button class="btn btn--primary">Ajouter</button>
            </div>
          </div>
        </article>
      </div>
    </section>

    <section class="section">
      <h2>Formulaire</h2>
      <div class="field" style="margin-top: 16px; max-width: 400px;">
        <label class="field__label">Email</label>
        <input class="field__input" type="email" placeholder="ton@email.com" />
      </div>
    </section>
  </div>

  <script type="module">
    import { CONFIG, isSupabaseReady } from './js/config.js';
    import { formatPrice } from './js/utils/format.js';
    console.log('[ZemarShop] Design System chargé ✅');
    console.log('[ZemarShop] Site :', CONFIG.SITE_NAME);
    console.log('[ZemarShop] Exemple prix :', formatPrice(15000));
  </script>
</body>
</html>
